<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="assistant-name" content="__ASSISTANT__">
  <title>__ASSISTANT__</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__ASSISTANT__">
  <link rel="apple-touch-icon" href="static/icons/icon-180.png">
  <link rel="icon" href="static/icons/icon-192.png">
  <link rel="stylesheet" href="static/mia.css">
  <script src="static/crypto.js"></script>
  <style>
    /* Phone / narrow-browser layout. Tokens and components come from mia.css. */
    html, body { height: 100dvh; display: flex; flex-direction: column; }
    header { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line-1); background: var(--glass-1); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
    header canvas { width: 46px; height: 42px; flex: none; }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; }
    .chip { font-size: 10px; color: var(--muted); padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line-1); background: var(--glass-1); white-space: nowrap; }
    .chip[data-state="warning"] { color: var(--err); border-color: var(--err-line); background: var(--err-dim); }
    header .url { display: none; }
    @media (max-width: 380px) { .chip, .enc-badge { display: none !important; } }
    /* next appointment + optional ETA (filled by shared.js) */
    .companion { display: none; flex: none; flex-direction: column; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line-1); background: var(--glass-1); font-size: 12px; }
    .companion.show { display: flex; }
    .companion-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .companion-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .companion-when { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .companion-eta { font-size: 11px; color: var(--muted); }
    .companion-eta.warn { color: var(--err); font-weight: 700; }
    .companion-eta.soon { color: #fff; font-weight: 700; }
    .companion-loc { font-size: 10px; color: var(--muted); }
    .companion-share { align-self: flex-start; margin-top: 2px; min-height: 40px; padding: 8px 14px; border-radius: 99px; background: var(--glass-3); border: 1px solid var(--line-2); color: var(--text); font-size: 11px; font-weight: 700; }
    .companion-share.live { background: var(--ok-dim); border-color: var(--ok-line); color: var(--ok); }
    main#feed { flex: 1; min-height: 80px; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
    .msg, .msg-file { max-width: 86%; }
    footer { flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line-1); background: var(--glass-1); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
    #inp { flex: 1; min-width: 140px; font-size: 16px; }
    footer .btn { min-height: 44px; }
    footer .icon-btn { width: 44px; min-height: 44px; }
    #mic-btn.recording { background: var(--err-dim); border-color: var(--err-line); color: var(--err); }
    #callBanner, #confirmBanner { padding-top: max(12px, env(safe-area-inset-top)); }
    #notice-stack { bottom: 84px; right: 12px; left: 12px; width: auto; }
    button, .btn { min-height: 44px; }
  </style>
</head>
<body data-layout="phone">
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="notice-stack" aria-label="Meldungen"></div>
  <div id="callBanner" role="alertdialog" aria-label="Eingehender Anruf">
    <div class="cb-txt">__ASSISTANT__ ruft an<small>Eingehender Anruf</small></div>
    <div class="cb-btns">
      <button type="button" class="cb-answer" id="cb-answer">Annehmen</button>
      <button type="button" class="cb-decline" id="cb-decline">Ablehnen</button>
    </div>
  </div>
  <div id="confirmBanner" role="alertdialog" aria-labelledby="cf-title">
    <div class="cf-lbl">Bestätigung nötig</div>
    <div class="cf-title" id="cf-title"></div>
    <div class="cf-detail" id="cf-detail"></div>
    <div class="cf-btns">
      <button type="button" class="cf-approve" id="cf-approve">Bestätigen</button>
      <button type="button" class="cf-reject" id="cf-reject">Ablehnen</button>
    </div>
  </div>

  <header>
    <canvas id="core-mini" width="46" height="42" aria-label="__ASSISTANT__"></canvas>
    <div class="logo">__ASSISTANT__</div>
    <span class="chip" id="core-state" data-state="standby" aria-live="polite">Bereit</span>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Verbinde …</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <div class="companion" id="companion">
    <div class="companion-row">
      <span class="companion-title" id="companion-title"></span>
      <span class="companion-when" id="companion-when"></span>
    </div>
    <div class="companion-eta" id="companion-eta"></div>
    <div class="companion-loc" id="companion-loc-status">Standort aus.</div>
    <button class="companion-share" id="companion-location-toggle" type="button" onclick="companionToggleLocation()">Live-Standort einschalten</button>
  </div>
  <main id="feed" role="log" aria-live="polite" aria-label="Gespräch"></main>
  <footer>
    <input id="inp" class="field" placeholder="Nachricht an __ASSISTANT__ …" autocomplete="off" aria-label="Nachricht an __ASSISTANT__">
    <button type="button" class="btn icon-btn" id="attach-btn" aria-label="Datei senden" title="Datei senden">📎</button>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none" aria-hidden="true" tabindex="-1">
    <button id="mic-btn" type="button" class="btn icon-btn" onclick="doMic()" aria-label="Sprachbefehl" title="Sprachbefehl">🎤</button>
    <button class="btn btn-wake" id="wake" type="button" onclick="doWake()">Wecken</button>
    <button class="btn btn-primary" type="button" onclick="doSend()">Senden</button>
  </footer>

  <script src="static/mia-core.js"></script>
  <script src="static/mia-ui.js"></script>
  <script src="static/shared.js"></script>
  <script>
    // Phone page: core in the header, UI actions routed onto the panes this layout really has.
    (function () {
      const $ = id => document.getElementById(id);
      MiaCore.mount($('core-mini'), { mini: true, name: _ASSISTANT });
      MiaState.subscribe(() => { const s = MiaState.current(); $('core-state').textContent = MiaState.label(s); $('core-state').dataset.state = s; });
      $('attach-btn').addEventListener('click', () => $('file-inp').click());

      const PANES = ['tasks', 'calendar', 'notes', 'files'];
      function selectPane(name) {
        document.querySelectorAll('.mvp-tab').forEach(b => b.classList.toggle('on', b.dataset.pane === name));
        document.querySelectorAll('.mvp-pane').forEach(p => p.classList.toggle('on', p.id === 'mvp-pane-' + name));
      }
      const views = { dashboard: { open() { $('feed').scrollTop = $('feed').scrollHeight; } }, chat: { open() { $('feed').scrollTop = $('feed').scrollHeight; } },
                      location: { open() { $('companion').scrollIntoView(); } } };
      PANES.forEach(p => { views[p] = { open() { selectPane(p); if (typeof mvpLoad === 'function') mvpLoad(); } }; });
      document.querySelectorAll('.mvp-tab').forEach(b => b.addEventListener('click', () => MiaUI.navigate(b.dataset.pane, { source: 'user' })));

      let files = [];
      document.addEventListener('mia:data', e => { if (e.detail && e.detail.files) files = e.detail.files; });
      const flash = n => { if (n) { n.classList.add('flash'); n.scrollIntoView({ block: 'nearest' }); setTimeout(() => n.classList.remove('flash'), 1800); } };
      const find = (q) => Array.from(document.querySelectorAll('#mvp-pane-' + q.pane + ' .mvp-item')).find(n => n.textContent.toLowerCase().includes(q.text.toLowerCase()));
      async function openFile(name) {
        MiaUI.navigate('files', { source: 'action', keepSelection: true });
        await mvpLoad();
        const f = files.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (!f) return { ok: false, reason: 'file_not_found' };
        MiaUI.select('file', f.name);
        flash(Array.from(document.querySelectorAll('#mvp-files .mvp-item')).find(n => n.dataset.name === f.name));
        return { ok: true };
      }
      async function openBy(pane, q) {
        MiaUI.navigate(pane, { source: 'action', keepSelection: true }); await mvpLoad();
        const n = find({ pane, text: q });
        if (!n) return { ok: false, reason: 'not_found' };
        MiaUI.select(pane, n.textContent.slice(0, 80)); flash(n); return { ok: true };
      }
      MiaUI.init({ default: 'chat', views, focusChat() { $('inp').focus(); return true; },
                   data: { openFile, openTask: q => openBy('tasks', q), openEvent: q => openBy('calendar', q) } });
    })();
  </script>
</body>
</html>
