<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIA Core Dashboard</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #05060a;
      --bg2:     #0b0d10;
      --surface: rgba(255,255,255,0.045);
      --surface2:rgba(255,255,255,0.08);
      --border:  rgba(255,255,255,0.10);
      --accent:  #ff8a1f;
      --accent2: #ff7a00;
      --accent3: #ffb15a;
      --adim:    rgba(255,138,31,0.14);
      --text:    #f3f2f7;
      --muted:   #93939e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
      --red:     #f87171;
      --glass:   linear-gradient(160deg, rgba(255,255,255,0.055), rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.8) 100%);
      --brain-a: #7a2f00;
      --brain-b: #ff7a00;
      --brain-c: #ffd7a3;
    }
    html, body {
      height: 100%; color: var(--text);
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255,122,0,0.06), transparent 60%),
        radial-gradient(ellipse at 50% 100%, var(--bg2) 0%, var(--bg) 60%);
      background-attachment: fixed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 13px 16px; border-bottom: 1px solid var(--border);
      background: var(--glass); backdrop-filter: blur(24px) saturate(140%);
      z-index: 20;
    }
    .logo { font-size: 15px; font-weight: 800; letter-spacing: 5px; display: flex; flex-direction: column; line-height: 1.1; }
    .logo em { color: var(--accent); font-style: normal; }
    .logo small { font-size: 8px; font-weight: 600; letter-spacing: 2.5px; color: var(--muted); }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none; white-space: nowrap;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: var(--red); }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; white-space: nowrap; }
    @media (max-width: 560px) { .url { display: none; } }
    @media (max-width: 480px) {
      header { padding: 10px 12px; gap: 8px; }
      .logo { font-size: 13px; letter-spacing: 3px; }
      .logo small { display: none; }
      .pill { padding: 3px 8px; font-size: 9px; }
      .enc-badge { font-size: 8px; padding: 2px 6px; }
    }

    /* ── QUICK NAV (view switch) ── */
    .quicknav {
      flex-shrink: 0; display: flex; gap: 6px; padding: 8px 16px;
      border-bottom: 1px solid var(--border); background: rgba(0,0,0,.42);
      backdrop-filter: blur(22px) saturate(135%); overflow-x: auto; z-index: 19;
    }
    .qn-btn {
      flex-shrink: 0; display: flex; align-items: center; gap: 7px;
      padding: 8px 14px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all .18s;
    }
    .qn-btn .qn-ic { font-size: 14px; line-height: 1; }
    .qn-btn:hover { color: var(--text); border-color: rgba(255,138,31,.35); }
    .qn-btn.active { color: var(--accent3); background: var(--adim); border-color: rgba(255,138,31,.4); box-shadow: 0 0 14px rgba(255,122,0,.12) inset; }

    /* ── CLOCK (header, real system time) ── */
    .clock { display: flex; flex-direction: column; align-items: flex-end; font-family: 'SFMono-Regular', Consolas, monospace; line-height: 1.2; margin-right: 6px; }
    .clock .ctime { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: var(--text); }
    .clock .cdate { font-size: 9px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
    @media (max-width: 480px) { .clock { display: none; } }

    /* ── SIDEBAR (desktop) ── */
    .body-shell { flex: 1; display: flex; min-height: 0; }
    .content-col { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .sidebar { display: none; }
    .sb-avatar {
      display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px;
      border-bottom: 1px solid var(--border); margin-bottom: 10px;
    }
    .sb-avatar-ic {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 35% 30%, #ffe9d1, var(--accent) 55%, #7a2f00 100%);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: #1a0f00;
    }
    .sb-avatar-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .sb-avatar-meta .nm { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; }
    .sb-avatar-meta .stx { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: .5px; }
    .sb-avatar-meta .stx .dot2 { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .sb-avatar-meta .stx.on { color: var(--green); }
    .sb-avatar-meta .stx.on .dot2 { background: var(--green); animation: blink 2s infinite; }
    .sb-item {
      display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 11px;
      border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; text-align: left;
      width: 100%; transition: all .15s;
    }
    .sb-item .ic { font-size: 16px; width: 18px; text-align: center; flex-shrink: 0; }
    .sb-item .lb { display: flex; flex-direction: column; gap: 1px; }
    .sb-item .lb b { font-size: 11px; font-weight: 800; letter-spacing: .8px; color: inherit; }
    .sb-item .lb small { font-size: 9px; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; }
    .sb-item:hover { color: var(--text); background: var(--surface); }
    .sb-item.active { color: var(--accent3); background: var(--adim); border-color: rgba(255,138,31,.35); }
    @media (min-width: 768px) {
      .sidebar { display: flex; flex-direction: column; width: 208px; flex-shrink: 0; padding: 16px 10px; gap: 3px; border-right: 1px solid var(--border); background: rgba(0,0,0,.32); }
      .quicknav { display: none; }
    }

    /* ── MAIN LAYOUT ── */
    .stage { flex: 1; display: flex; min-height: 0; position: relative; }
    .view { display: none; flex: 1; min-height: 0; min-width: 0; }
    .view.active { display: flex; }

    /* ── CORE VIEW: body hero + hud panel ── */
    #view-core { position: relative; }
    .body-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; padding: 18px; min-width: 0; overflow: hidden;
    }
    .body-wrap::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 55% 60% at 50% 42%, rgba(255,122,0,.09), transparent 65%);
      pointer-events: none;
    }
    .android-shell { position: relative; width: min(78vw, 420px); max-height: 100%; filter: drop-shadow(0 20px 50px rgba(0,0,0,.6)); }
    .android-shell svg { width: 100%; height: auto; display: block; overflow: visible; pointer-events: none; }

    .hotspot { cursor: pointer; outline: none; pointer-events: auto; }
    .hotspot .hs-hit { fill: transparent; }
    .hotspot .hs-ring { fill: none; stroke: rgba(255,178,90,.55); stroke-width: 1.1; opacity: 0; transition: opacity .2s, r .2s; transform-box: fill-box; transform-origin: center; }
    .hotspot .hs-dot  { fill: url(#hsGlow); opacity: .85; transition: opacity .2s, transform .2s; transform-box: fill-box; transform-origin: center; animation: hsPulse 3.2s ease-in-out infinite; }
    .hotspot:hover .hs-dot, .hotspot:focus-visible .hs-dot, .hotspot.selected .hs-dot { opacity: 1; transform: scale(1.35); }
    .hotspot:hover .hs-ring, .hotspot:focus-visible .hs-ring, .hotspot.selected .hs-ring { opacity: 1; }
    @keyframes hsPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    .hotspot .hs-label {
      opacity: 0; transition: opacity .16s; pointer-events: none;
      font-size: 8.5px; font-weight: 800; letter-spacing: .4px; fill: var(--accent3);
      text-transform: uppercase;
      paint-order: stroke;
      stroke: rgba(0,0,0,.65); stroke-width: 2px; stroke-linejoin: round;
    }
    .hotspot:hover .hs-label, .hotspot:focus-visible .hs-label, .hotspot.selected .hs-label { opacity: 1; }

    .core-frame { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 1; }
    .core-glass { fill: rgba(255,157,63,.035); stroke: rgba(255,203,148,.22); stroke-width: 1; }
    .core-groove { fill: none; stroke: rgba(255,255,255,0.10); stroke-width: .8; }
    .core-panel-line { stroke: rgba(255,255,255,0.08); stroke-width: .6; }
    .energy-line { fill: none; stroke: rgba(255,138,31,.5); stroke-width: .8; stroke-dasharray: 2 3; animation: flow 2.4s linear infinite; opacity: .55; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .core-glow { fill: url(#coreGlow); transform-box: fill-box; transform-origin: center; animation: brainBreathe 4.6s ease-in-out infinite; }
    @keyframes brainBreathe { 0%,100% { opacity:.4; transform:scale(.92); } 50% { opacity:.85; transform:scale(1.06); } }

    /* body reacts to global AI state */
    .android-shell[data-state="awake"]     .core-glow { animation-duration: 2.3s; }
    .android-shell[data-state="listening"] .core-glow { animation-duration: 1s; }
    .android-shell[data-state="speaking"]  .core-glow { animation-duration: .6s; }
    .android-shell[data-state="listening"] .eye-glow { opacity: 1 !important; }
    .android-shell[data-state="speaking"]  .mouth-glow { opacity: 1 !important; }

    /* ── HUD PANEL ── */
    .hud-panel {
      width: 0; flex-shrink: 0; overflow: hidden; transition: width .28s cubic-bezier(.4,0,.2,1);
      border-left: 1px solid transparent;
    }
    .hud-panel.open { width: min(400px, 92vw); border-left: 1px solid var(--border); }
    .hud-inner {
      width: min(400px, 92vw); height: 100%; display: flex; flex-direction: column;
      background: linear-gradient(160deg, rgba(20,16,12,.72), rgba(5,6,8,.92));
      backdrop-filter: blur(28px) saturate(150%);
    }
    .hud-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); position: relative; }
    .hud-icon { font-size: 20px; margin-bottom: 6px; opacity: .9; }
    .hud-title { font-size: 17px; font-weight: 800; letter-spacing: 1.5px; color: var(--text); }
    .hud-sub { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: .3px; }
    .hud-close {
      position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .hud-close:hover { color: var(--text); border-color: rgba(255,138,31,.4); }
    .hud-tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--border); }
    .hud-tab {
      flex: 1; padding: 9px 4px 10px; background: none; border: none; color: var(--muted);
      font-size: 10px; font-weight: 800; letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
      border-bottom: 2px solid transparent; transition: all .15s;
    }
    .hud-tab:hover { color: var(--text); }
    .hud-tab.active { color: var(--accent3); border-bottom-color: var(--accent); }
    .hud-body { flex: 1; overflow-y: auto; padding: 16px 18px 20px; font-size: 13px; line-height: 1.6; color: var(--text); }
    .hud-body::-webkit-scrollbar { width: 4px; }
    .hud-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .hud-desc { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
    .hud-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border);
      margin-bottom: 7px; font-size: 12px;
    }
    .hud-row .k { color: var(--muted); font-weight: 700; letter-spacing: .5px; font-size: 10.5px; text-transform: uppercase; }
    .hud-row .v { font-weight: 700; color: var(--text); }
    .hud-row .v.on   { color: var(--green); }
    .hud-row .v.warn { color: var(--accent3); }
    .hud-row .v.off  { color: var(--red); }
    .hud-btn {
      width: 100%; margin-top: 6px; padding: 11px; border-radius: 11px; border: 1px solid rgba(255,138,31,.4);
      background: var(--adim); color: var(--accent3); font-size: 11px; font-weight: 800; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; transition: all .15s;
    }
    .hud-btn:hover { background: rgba(255,138,31,.24); }
    .hud-btn:active { transform: scale(.98); }
    .hud-btn.ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
    .hud-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0; }
    .hud-filelist { display: flex; flex-direction: column; gap: 7px; }
    .hud-file { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
    .hud-file .fi { font-size: 18px; }
    .hud-file .fm { flex: 1; min-width: 0; }
    .hud-file .fn { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-file .fs { font-size: 10px; color: var(--muted); }
    .hud-file a { color: var(--accent3); font-size: 10px; font-weight: 700; text-decoration: none; }

    /* mobile: hud panel becomes bottom sheet */
    @media (max-width: 760px) {
      .stage { flex-direction: column; }
      .hud-panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto !important;
        height: 0; max-height: 78vh; border-left: none; border-top: 1px solid var(--border);
        z-index: 40; transition: height .28s cubic-bezier(.4,0,.2,1); border-radius: 18px 18px 0 0; overflow: hidden; }
      .hud-panel.open { height: 62vh; }
      .hud-inner { width: 100% !important; border-radius: 18px 18px 0 0; }
      .android-shell { width: min(84vw, 340px); }
    }

    /* ── CHAT VIEW ── */
    #view-chat { flex-direction: column; }
    main#feed { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main#feed::-webkit-scrollbar { width: 4px; }
    main#feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .msg { max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; box-shadow: 0 4px 18px rgba(0,0,0,0.25); }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(255,138,31,0.22); border-bottom-left-radius:5px; backdrop-filter: blur(16px); }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:5px; backdrop-filter: blur(16px); }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; box-shadow:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; border-bottom-right-radius: 5px;
      padding: 12px 15px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease; backdrop-filter: blur(16px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: var(--red); }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── SYSTEM VIEW ── */
    #view-system { padding: 20px 16px; overflow-y: auto; flex-direction: column; gap: 14px; }
    .sys-heading { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .system-deck {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .system-card {
      min-width: 0; padding: 14px 15px; border: 1px solid var(--border); border-radius: 14px;
      background: linear-gradient(150deg, rgba(255,255,255,.055), rgba(255,138,31,.025) 52%, rgba(0,0,0,.3));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }
    .system-card .k { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
    .system-card .v { margin-top: 5px; font-size: 18px; font-weight: 750; color: #f6f3ef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .system-card.online .v { color: var(--green); }
    .system-card.active .v { color: var(--accent3); }
    .system-card.dim .v { color: var(--muted); }

    /* ── FOOTER (always-on quick command bar) ── */
    footer { flex-shrink:0; padding:11px 14px; border-top:1px solid var(--border); background:var(--glass); backdrop-filter: blur(24px) saturate(140%); display:flex; gap:8px; align-items:center; z-index: 15; }
    #inp { flex:1; padding:12px 15px; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s, box-shadow 0.15s; }
    #inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,138,31,0.16); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:12px 16px; border:none; border-radius:14px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s,box-shadow 0.2s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.85; }
    .btn-send { background: rgba(255,138,31,0.16); border: 1px solid rgba(255,138,31,0.45); color: #ffe9d1; }
    .btn-send:hover { box-shadow: 0 0 16px rgba(255,138,31,0.3); }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 12px 14px; font-size: 16px; line-height: 1; border-radius: 14px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, border-color .2s, color .2s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.9; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 12px 14px; font-size: 16px; line-height: 1; border-radius: 14px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s, color .2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.9; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    #mic-btn .mic-label { margin-left:7px; font-size:12px; font-weight:700; letter-spacing:.2px; }
    #mic-btn.session-active { border-color:rgba(255,138,31,.55); color:#ffd7a3; background:rgba(255,138,31,.10); }
    .end-session-btn { display:none; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.42); color:#fca5a5; }
    .end-session-btn.show { display:block; }

    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    @media (max-width: 560px) {
      footer { padding: 9px 8px; gap: 5px; }
      #inp { padding: 11px 12px; font-size: 13px; }
      .btn, .btn-attach, #mic-btn { padding: 11px 10px; font-size: 10px; }
      #mic-btn .mic-label { display: none; }
      .btn-wake, .end-session-btn { font-size: 9px; padding: 11px 8px; }
    }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap; z-index: 60;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── INCOMING CALL ── */
    #callBanner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: none; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: rgba(255,138,31,0.16);
      border-bottom: 1px solid rgba(255,138,31,0.4);
      backdrop-filter: blur(24px) saturate(140%);
      animation: pop 0.18s ease;
    }
    #callBanner.show { display: flex; }
    #callBanner .cb-txt { font-size: 13px; font-weight: 700; letter-spacing: .3px; color: #ffe9d1; }
    #callBanner .cb-txt small { display: block; font-size: 10px; font-weight: 500; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
    #callBanner .cb-btns { display: flex; gap: 8px; flex-shrink: 0; }
    #callBanner button { border: none; border-radius: 99px; padding: 8px 16px; font-size: 12px; font-weight: 700; cursor: pointer; }
    #callBanner .cb-answer { background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.5); color: var(--green); animation: mic-pulse 1s ease-in-out infinite; }
    #callBanner .cb-decline { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); color: var(--red); }

    @media (prefers-reduced-motion: reduce) {
      .hs-dot, .core-glow, .dot, #mic-btn.recording, .energy-line { animation: none !important; }
    }

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('mia_token');
    const _sessionKey = sessionStorage.getItem('mia_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── View switching (MIA Core / Kommunikation / System) ───────────────────
    const _views = ['core', 'chat', 'system'];
    function switchView(name) {
      if (!_views.includes(name)) return;
      _views.forEach(v => {
        document.getElementById('view-' + v).classList.toggle('active', v === name);
      });
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
      if (name === 'chat') { feed.scrollTop = feed.scrollHeight; }
    }
    document.querySelectorAll('.nav-btn').forEach(b => {
      b.addEventListener('click', () => switchView(b.dataset.view));
    });

    // ── Live clock (real system time — header) ─────────────────────────────
    const _clockTime = document.getElementById('clock-time');
    const _clockDate = document.getElementById('clock-date');
    function _tickClock() {
      const now = new Date();
      _clockTime.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      _clockDate.textContent = now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
    }
    _tickClock();
    setInterval(_tickClock, 15000);

    // ── Sidebar identity chip mirrors the connection pill ───────────────────
    const _sbStatus    = document.getElementById('sb-status');
    const _sbStatusTxt = document.getElementById('sb-status-txt');
    function _syncSidebarStatus() {
      if (!_sbStatus) return;
      _sbStatus.classList.toggle('on', pill.classList.contains('on'));
      _sbStatusTxt.textContent = stTxt.textContent;
    }

    // ── Live system deck (shared by System view + Core HUD panel) ────────────
    let _lastSysStatus = null;
    let _lastPingMs = null;
    function _setSystemCard(id, value, active = false) {
      const card = document.getElementById(id);
      const val = card?.querySelector('.v');
      if (!card || !val) return;
      val.textContent = String(value);
      card.classList.remove('online', 'active', 'dim');
      card.classList.add(active ? 'active' : 'online');
    }
    async function refreshSystemDeck() {
      const t0 = performance.now();
      try {
        const res = await _authFetch('/api/system-status', { cache: 'no-store' });
        if (!res.ok) throw new Error('status unavailable');
        const s = await res.json();
        _lastPingMs = Math.round(performance.now() - t0);
        _lastSysStatus = s;
        _setSystemCard('sys-server', 'ONLINE');
        _setSystemCard('sys-clients', s.live_clients, s.live_clients > 0);
        _setSystemCard('sys-devices', s.paired_devices, s.paired_devices > 0);
        _setSystemCard('sys-queue', s.command_queue, s.command_queue > 0);
        _setSystemCard('sys-history', s.session_events, s.session_events > 0);
      } catch {
        _lastSysStatus = null;
        const card = document.getElementById('sys-server');
        const val = card?.querySelector('.v');
        if (card && val) {
          val.textContent = 'NICHT VERFÜGBAR';
          card.classList.remove('online', 'active');
          card.classList.add('dim');
        }
      }
      _renderHudIfOpen();
    }
    refreshSystemDeck();
    setInterval(refreshSystemDeck, 5000);

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    // Legacy KDF salt — must match dashboard/server.py; never displayed.
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── Android body / brain state ────────────────────────────────────────────
    const androidShell = document.getElementById('android-shell');
    let _baseBrainState = 'idle';
    let _brainTimer;
    function _setBrainState(s) { androidShell.dataset.state = s; }
    function _pulseBrain(state, ms = 1400) {
      _setBrainState(state);
      clearTimeout(_brainTimer);
      _brainTimer = setTimeout(() => _setBrainState(_baseBrainState), ms);
      _renderHudIfOpen();
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote-Sitzung aktiv.'); toast('Mit MIA verbunden'); };
    ws.onclose   = () => sys('Verbindung getrennt — Seite neu laden, um erneut zu verbinden.');
    ws.onerror   = () => sys('Verbindungsfehler.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Aufweckwort erkannt — verbinde…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
      if (m.type === 'audio')         _playPcm16(m.data, m.rate);
      if (m.type === 'audio_stop')    _stopPlayback();
      if (m.type === 'incoming_call') _showIncomingCall();
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Aktiv'; wake.classList.remove('show');
        _baseBrainState = 'awake';
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Ruhend'; wake.classList.add('show');
        _baseBrainState = 'idle';
      }
      _setBrainState(_baseBrainState);
      _syncSidebarStatus();
      _renderHudIfOpen();
    }
    _syncSidebarStatus();

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'assistant') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">MIA</div>${esc(text)}`;
        _pulseBrain('speaking');
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">Du</div>${esc(text)}`;
        _pulseBrain('listening', 900);
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    const _fileLog = []; // { name, size, dir: 'sent'|'received', url }

    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Wird gesendet</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Gesendet';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Zurückladen</a>`);
          toast('Datei gesendet!');
          _fileLog.unshift({ name: savedName, size: file.size, dir: 'sent', url: dlUrl });
          _renderHudIfOpen();
        } else {
          let errMsg = 'Upload fehlgeschlagen';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = 'var(--red)';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Verbindungsfehler';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Empfangen</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Herunterladen</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('Datei am Computer empfangen!');
      _fileLog.unshift({ name: m.name, size: m.size, dir: 'received', url: dlUrl });
      _renderHudIfOpen();
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sende Aufwecksignal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Playback — MIA's spoken replies, streamed as PCM16 @ 24 kHz ───────
    let _playCtx    = null;
    let _playCursor = 0;      // ctx.currentTime cursor for gapless scheduling
    let _playNodes  = [];     // scheduled sources, so audio_stop can cut them off

    function _ensurePlayCtx() {
      if (!_playCtx) {
        try { _playCtx = new AudioContext({ sampleRate: 24000 }); }
        catch (_) { _playCtx = new AudioContext(); }
      }
      if (_playCtx.state === 'suspended') _playCtx.resume().catch(() => {});
      return _playCtx;
    }

    function _playPcm16(b64, rate) {
      const ctx  = _ensurePlayCtx();
      const raw  = atob(b64);
      const buf  = new ArrayBuffer(raw.length);
      const view = new Uint8Array(buf);
      for (let i = 0; i < raw.length; i++) view[i] = raw.charCodeAt(i);
      const pcm = new Int16Array(buf);
      if (!pcm.length) return;

      const audioBuf = ctx.createBuffer(1, pcm.length, rate || 24000);
      const ch = audioBuf.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;

      const src = ctx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(ctx.destination);

      const startAt = Math.max(ctx.currentTime, _playCursor);
      src.start(startAt);
      _playCursor = startAt + audioBuf.duration;
      _playNodes.push(src);
      src.onended = () => { _playNodes = _playNodes.filter(n => n !== src); };
    }

    function _stopPlayback() {
      for (const n of _playNodes) { try { n.stop(); } catch (_) {} }
      _playNodes = [];
      if (_playCtx) _playCursor = _playCtx.currentTime;
    }

    // ── Incoming call — MIA wants to talk on its own initiative and
    // nobody's mic is open to hear it ─────────────────────────────────────────
    const callBanner = document.getElementById('callBanner');
    let _callTimer = null;

    function _showIncomingCall() {
      // readyState: 0=CONNECTING, 1=OPEN — genuinely on the line already.
      // 2=CLOSING/3=CLOSED means the object is stale (its onclose handler just
      // hasn't nulled it yet) — that must NOT suppress the banner, or MIA can
      // never call again until the page is reloaded.
      if (_voiceWs && _voiceWs.readyState <= 1) return;
      callBanner.classList.add('show');
      toast('📞 MIA ruft an');
      clearTimeout(_callTimer);
      _callTimer = setTimeout(_dismissCall, 30000);   // missed call after 30s
    }

    function _dismissCall() {
      callBanner.classList.remove('show');
      clearTimeout(_callTimer);
    }

    document.getElementById('cb-answer').addEventListener('click', () => {
      _ensurePlayCtx();   // unlock playback on this user gesture
      _dismissCall();
      doMic();
    });
    document.getElementById('cb-decline').addEventListener('click', _dismissCall);

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;
    let _voiceSessionActive = false;
    let _voiceReconnectTimer = null;
    const endSessionBtn = document.getElementById('end-session-btn');

    function _micIdle() {
      micBtn.innerHTML = '🎤 <span class="mic-label">Mit MIA sprechen</span>';
      micBtn.title     = _voiceSessionActive ? 'Mia-Sitzung läuft' : 'Mit MIA sprechen';
      micBtn.classList.remove('recording');
      micBtn.classList.toggle('session-active', _voiceSessionActive);
      endSessionBtn.classList.toggle('show', _voiceSessionActive);
      _setBrainState(_voiceSessionActive ? 'awake' : _baseBrainState);
      _renderHudIfOpen();
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      switchView('chat');
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(255,138,31,0.07)',
        'border:1px solid rgba(255,138,31,0.22)', 'border-radius:16px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#ffd7a3;letter-spacing:.5px;margin-bottom:10px">🎤 Einmalige Sprach-Einrichtung</div>' +
        '<ol style="padding-left:18px;color:#a9a9b3;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Neuen Tab öffnen → gehe zu <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Suche: <strong style="color:#f3f2f7">Insecure origins treated as secure</strong></li>' +
        '<li>Füge diese URL in das Feld ein:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Auf <strong style="color:#22c55e">Enabled</strong> setzen → <strong style="color:#f3f2f7">Relaunch</strong> tippen</li>' +
        '<li>Hierher zurückkehren und 🎤 tippen</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL kopiert!')).catch(() => {});
      });
    }

    async function doMic(_reconnect = false) {
      if (_voiceSessionActive && !_reconnect) {
        toast('Mia-Sitzung läuft bereits');
        return;
      }
      if (!_reconnect) {
        _voiceSessionActive = true;
        clearTimeout(_voiceReconnectTimer);
        _micIdle();
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Mikrofon verweigert — auf das Adressleisten-Schloss tippen und Mikrofon erlauben.'
          : 'Mikrofonfehler: ' + e.message);
        if (!_reconnect) { _voiceSessionActive = false; _micIdle(); }
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '🎤 <span class="mic-label">Mia hört zu</span>';
        micBtn.title     = 'Mia-Sitzung aktiv';
        micBtn.classList.add('recording', 'session-active');
        endSessionBtn.classList.add('show');
        _setBrainState('listening');
        sys('Sprachverbindung live — jetzt sprechen');
        toast('🎤 Live');
        _renderHudIfOpen();
      };

      ws.onclose = () => {
        _cleanupVoiceTransport();
        if (_voiceSessionActive) {
          sys('Sprachverbindung unterbrochen — Sitzung bleibt aktiv, verbinde neu…');
          clearTimeout(_voiceReconnectTimer);
          _voiceReconnectTimer = setTimeout(() => {
            if (_voiceSessionActive && !_voiceWs) doMic(true);
          }, 1200);
        }
      };
      ws.onerror = () => { sys('Sprachverbindung unterbrochen.'); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _cleanupVoiceTransport() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }

    function endVoiceSession() {
      if (!_voiceSessionActive) return;
      _voiceSessionActive = false;
      clearTimeout(_voiceReconnectTimer);
      _voiceReconnectTimer = null;
      _cleanupVoiceTransport();
      _stopPlayback();
      sys('Mia-Sitzung beendet.');
      toast('Sitzung beendet');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // ── BODY HUD PANEL — zone config + rendering ─────────────────────────────

          <div class="hud-row"><span class="k">Verschlüsselung</span><span class="v ${_encReady ? 'on' : 'off'}">${_encReady ? 'AES-256 aktiv' : 'Inaktiv'}</span></div>
        `,
        tools: () => `

        `,

      },
      augen: {

        desc: 'Mikrofon-Wahrnehmung — MIA hört über den Live-Sprachkanal zu.',
        overview: () => `
          <div class="hud-desc">${_zones.augen.desc}</div>

          <div class="hud-row"><span class="k">Aufnahme</span><span class="v ${micBtn.classList.contains('recording') ? 'on' : ''}">${micBtn.classList.contains('recording') ? 'Läuft' : 'Gestoppt'}</span></div>
        `,
        details: () => `
          <div class="hud-desc">Audiokanal: PCM16 · 16 kHz Eingang, 24 kHz Wiedergabe.</div>
          <div class="hud-row"><span class="k">Mikrofonzugriff</span><span class="v">${navigator.mediaDevices?.getUserMedia ? 'Unterstützt' : 'Nicht verfügbar'}</span></div>
        `,
        tools: () => `
          <button class="hud-btn" id="hud-act-mic">${_voiceSessionActive ? 'Sitzung beenden' : 'Sprechen starten'}</button>
        `,
        toolsInit: () => {
          document.getElementById('hud-act-mic')?.addEventListener('click', () => {
            _voiceSessionActive ? endVoiceSession() : doMic();
            setTimeout(_renderHudIfOpen, 200);
          });
        },
        settings: () => `<div class="hud-desc">Mikrofonrechte werden vom Browser verwaltet (Adressleisten-Schloss).</div>`,
      },
      mund: {
        icon: '💬', title: 'MUND', sub: 'Sprache / Kommunikation / Ausgabe',
        desc: 'Der Kommunikationskanal — Text- und Sprachausgabe von MIA.',
        overview: () => `
          <div class="hud-desc">${_zones.mund.desc}</div>
          <div class="hud-row"><span class="k">Letzter Kanal</span><span class="v">${feed.lastElementChild ? 'Aktiv' : 'Kein Verlauf'}</span></div>
          <div class="hud-row"><span class="k">Verbindung</span><span class="v ${pill.classList.contains('on') ? 'on' : 'warn'}">${stTxt.textContent}</span></div>
        `,
        details: () => `<div class="hud-desc">Nachrichten werden Ende-zu-Ende über AES-256 verschlüsselt, sofern ein Sitzungsschlüssel vorliegt.</div>`,
        tools: () => `<button class="hud-btn" id="hud-act-open-chat">Kommunikation öffnen</button>`,
        toolsInit: () => {
          document.getElementById('hud-act-open-chat')?.addEventListener('click', () => switchView('chat'));
        },
        settings: () => `<div class="hud-desc">Keine separaten Einstellungen.</div>`,
      },
      core: {
        icon: '◎', title: 'ZENTRALER CORE', sub: 'Hauptsteuerung von MIA',
        desc: 'Der zentrale Systemkern — Gesamtstatus aller verbundenen Komponenten.',
        overview: () => `
          <div class="hud-desc">${_zones.core.desc}</div>
          <div class="hud-row"><span class="k">Core</span><span class="v on">ONLINE</span></div>
          <div class="hud-row"><span class="k">Live Clients</span><span class="v">${_lastSysStatus ? _lastSysStatus.live_clients : '–'}</span></div>
          <div class="hud-row"><span class="k">Gekoppelte Geräte</span><span class="v">${_lastSysStatus ? _lastSysStatus.paired_devices : '–'}</span></div>
        `,
        details: () => `
          <div class="hud-row"><span class="k">Befehlswarteschlange</span><span class="v">${_lastSysStatus ? _lastSysStatus.command_queue : '–'}</span></div>
          <div class="hud-row"><span class="k">Sitzungsereignisse</span><span class="v">${_lastSysStatus ? _lastSysStatus.session_events : '–'}</span></div>
        `,
        tools: () => `
          <button class="hud-btn" id="hud-act-wake2">Aufwecken</button>
          <button class="hud-btn ghost" id="hud-act-sys">System-Ansicht öffnen</button>
        `,
        toolsInit: () => {
          document.getElementById('hud-act-wake2')?.addEventListener('click', doWake);
          document.getElementById('hud-act-sys')?.addEventListener('click', () => switchView('system'));
        },
        settings: () => `<div class="hud-desc">Systemweite Einstellungen sind serverseitig konfiguriert.</div>`,
      },
      instinkt: {
        icon: '💠', title: 'INSTINKT', sub: 'Priorisierung / Warteschlange',
        desc: 'Priorisiert eingehende Befehle über die Warteschlange.',
        overview: () => `
          <div class="hud-desc">${_zones.instinkt.desc}</div>
          <div class="hud-row"><span class="k">Befehlswarteschlange</span><span class="v ${_lastSysStatus && _lastSysStatus.command_queue > 0 ? 'warn' : ''}">${_lastSysStatus ? _lastSysStatus.command_queue : '–'}</span></div>
        `,
        details: () => `<div class="hud-desc">Befehle werden in Ankunftsreihenfolge verarbeitet und über den Core gemeldet.</div>`,
        tools: () => `<div class="hud-empty">Keine manuellen Aktionen erforderlich.</div>`,
        settings: () => `<div class="hud-desc">Keine separaten Einstellungen.</div>`,
      },
      immunsystem: {
        icon: '🛡', title: 'IMMUNSYSTEM', sub: 'Schutz / Überwachung / Sicherheit',
        desc: 'Absicherung der Verbindung: Verschlüsselung, Authentifizierung, Transportsicherheit.',
        overview: () => `
          <div class="hud-desc">${_zones.immunsystem.desc}</div>
          <div class="hud-row"><span class="k">Verschlüsselung</span><span class="v ${_encReady ? 'on' : 'off'}">${_encReady ? 'AES-256 aktiv' : 'Nicht aktiv'}</span></div>
          <div class="hud-row"><span class="k">Sitzungstoken</span><span class="v ${_authToken ? 'on' : 'off'}">${_authToken ? 'Vorhanden' : 'Fehlt'}</span></div>
          <div class="hud-row"><span class="k">Transport</span><span class="v ${location.protocol === 'https:' ? 'on' : 'warn'}">${location.protocol === 'https:' ? 'HTTPS' : 'HTTP'}</span></div>
        `,
        details: () => `<div class="hud-desc">Schlüsselableitung erfolgt lokal aus dem Sitzungsschlüssel; Klartext-Schlüssel verlassen den Browser nicht.</div>`,
        tools: () => `<div class="hud-empty">Keine manuellen Aktionen erforderlich.</div>`,
        settings: () => `<div class="hud-desc">Sicherheitsrichtlinien werden serverseitig verwaltet.</div>`,
      },
      skelett: {
        icon: '🦴', title: 'SKELETT', sub: 'Stabilität / Client-Integrität',
        desc: 'Technischer Zustand des verbundenen Endgeräts.',
        overview: () => `
          <div class="hud-desc">${_zones.skelett.desc}</div>
          <div class="hud-row"><span class="k">Netzwerk</span><span class="v ${navigator.onLine ? 'on' : 'off'}">${navigator.onLine ? 'Online' : 'Offline'}</span></div>
          <div class="hud-row"><span class="k">Ansicht</span><span class="v">${window.innerWidth}×${window.innerHeight}</span></div>
        `,
        details: () => `<div class="hud-desc" style="word-break:break-word">${esc(navigator.userAgent)}</div>`,
        tools: () => `<div class="hud-empty">Keine manuellen Aktionen erforderlich.</div>`,
        settings: () => `<div class="hud-desc">Keine separaten Einstellungen.</div>`,
      },
      reflexe: {
        icon: '⚡', title: 'REFLEXE', sub: 'Schnelle Reaktion / Latenz',
        desc: 'Reaktionszeit zwischen Dashboard und Core-Server.',
        overview: () => `
          <div class="hud-desc">${_zones.reflexe.desc}</div>
          <div class="hud-row"><span class="k">Letzte Antwortzeit</span><span class="v ${_lastPingMs != null && _lastPingMs < 300 ? 'on' : 'warn'}">${_lastPingMs != null ? _lastPingMs + ' ms' : '–'}</span></div>
        `,
        details: () => `<div class="hud-desc">Gemessen bei der letzten Systemstatus-Abfrage (alle 5 Sekunden).</div>`,
        tools: () => `<button class="hud-btn ghost" id="hud-act-refresh">Jetzt messen</button>`,
        toolsInit: () => {
          document.getElementById('hud-act-refresh')?.addEventListener('click', async () => { await refreshSystemDeck(); });
        },
        settings: () => `<div class="hud-desc">Keine separaten Einstellungen.</div>`,
      },
      fernsteuerung: {
        icon: '📡', title: 'FERNSTEUERUNG', sub: 'Zugriff / Geräte / Synchronisation',
        desc: 'Gekoppelte Geräte und aktive Fernzugriffe auf MIA.',
        overview: () => `
          <div class="hud-desc">${_zones.fernsteuerung.desc}</div>
          <div class="hud-row"><span class="k">Gekoppelte Geräte</span><span class="v">${_lastSysStatus ? _lastSysStatus.paired_devices : '–'}</span></div>
          <div class="hud-row"><span class="k">Live Clients</span><span class="v">${_lastSysStatus ? _lastSysStatus.live_clients : '–'}</span></div>
        `,
        details: () => `<div class="hud-desc">Eingehende Anrufe von MIA erscheinen als Banner am oberen Bildschirmrand, sobald kein Mikrofon geöffnet ist.</div>`,
        tools: () => `<div class="hud-empty">Keine manuellen Aktionen erforderlich.</div>`,
        settings: () => `<div class="hud-desc">Geräte werden über die Haupt-App von MIA gekoppelt.</div>`,
      },
      haende: {
        icon: '✋', title: 'HÄNDE', sub: 'Ausführung / Dateien / Aktionen',
        desc: 'Datei-Übertragung zwischen diesem Gerät und MIA.',
        overview: () => `
          <div class="hud-desc">${_zones.haende.desc}</div>
          <div class="hud-row"><span class="k">Übertragene Dateien</span><span class="v">${_fileLog.length}</span></div>
        `,
        details: () => _fileLog.length
          ? `<div class="hud-filelist">${_fileLog.slice(0, 12).map(f => `
              <div class="hud-file">
                <div class="fi">${_fileIcon(f.name)}</div>
                <div class="fm"><div class="fn">${esc(f.name)}</div><div class="fs">${_fmtSize(f.size)} · ${f.dir === 'sent' ? 'Gesendet' : 'Empfangen'}</div></div>
                <a href="${f.url}" download="${esc(f.name)}">⬇</a>
              </div>`).join('')}</div>`
          : `<div class="hud-empty">Noch keine Dateien übertragen.</div>`,
        tools: () => `<button class="hud-btn" id="hud-act-file">Datei senden</button>`,
        toolsInit: () => {
          document.getElementById('hud-act-file')?.addEventListener('click', () => document.getElementById('file-inp').click());
        },
        settings: () => `<div class="hud-desc">Keine separaten Einstellungen.</div>`,
      },
    };

    function _renderHudTab() {
      const zone = _zones[_activeZone];
      if (!zone) return;
      const fn = zone[_activeTab];
      hudBody.innerHTML = fn ? fn() : '<div class="hud-empty">Keine Daten.</div>';
      if (_activeTab === 'tools' && zone.toolsInit) zone.toolsInit();
    }

    function _renderHudIfOpen() {
      if (hudPanel.classList.contains('open')) _renderHudTab();
    }

    function openZone(zoneId) {
      const zone = _zones[zoneId];
      if (!zone) return;
      _activeZone = zoneId;
      _activeTab  = 'overview';
      document.querySelectorAll('.hotspot').forEach(h => h.classList.toggle('selected', h.dataset.zone === zoneId));
      hudIcon.textContent  = zone.icon;
      hudTitle.textContent = zone.title;
      hudSub.textContent   = zone.sub;
      document.querySelectorAll('.hud-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'overview'));
      hudPanel.classList.add('open');
      _renderHudTab();
    }

    function closePanel() {
      hudPanel.classList.remove('open');
      _activeZone = null;
      document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('selected'));
    }

    document.querySelectorAll('.hotspot').forEach(h => {
      h.addEventListener('click', () => openZone(h.dataset.zone));
      h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openZone(h.dataset.zone); } });
    });
    document.getElementById('hud-close').addEventListener('click', closePanel);
    document.querySelectorAll('.hud-tab').forEach(t => {
      t.addEventListener('click', () => {
        _activeTab = t.dataset.tab;
        document.querySelectorAll('.hud-tab').forEach(x => x.classList.toggle('active', x === t));
        _renderHudTab();
      });
    });
  </script>
</body>
</html>
