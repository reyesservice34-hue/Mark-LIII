<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JARVIS</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="icon" href="/static/icons/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #000000;
      --card:   linear-gradient(160deg, rgba(255,255,255,0.06), rgba(0,0,0,0.6) 55%, rgba(0,0,0,0.82) 100%);
      --border: rgba(255,255,255,0.10);
      --accent: #ab8bf5;
      --adim:   rgba(171,139,245,0.15);
      --text:   #f3f2f7;
      --muted:  #93939e;
      --brain-a: #4c1d95;
      --brain-b: #7c3aed;
      --brain-c: #a78bfa;
    }
    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse 60% 45% at 50% 8%, rgba(124,58,237,0.14), transparent 60%),
        radial-gradient(ellipse at 50% 100%, #0a0a0c 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 340px;
      padding: 40px 36px 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      text-align: center;
      backdrop-filter: blur(28px) saturate(140%);
      box-shadow: inset 0 1px rgba(255,255,255,0.08), 0 24px 60px rgba(0,0,0,0.45);
    }

    /* ── BRAIN AVATAR ── */
    .brain { position: relative; width: 76px; height: 70px; margin: 0 auto 14px; filter: drop-shadow(0 0 12px rgba(0,0,0,0.5)); }
    .brain svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .brain-outline path, .brain-outline use { fill: rgba(255,255,255,0.035); stroke: rgba(255,255,255,0.18); stroke-width: 1.3; }
    .brain-groove { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 1; }
    .brain-halo { opacity: 0.6; transform-origin: 50px 46px; animation: brainBreathe 4.6s ease-in-out infinite; }
    .brain-node { fill: url(#brainGlow); transform-box: fill-box; transform-origin: center; animation: brainPulse 3.8s ease-in-out infinite; }
    .brain-node.n2 { animation-delay: .5s }
    .brain-node.n3 { animation-delay: 1.1s }
    .brain-node.n4 { animation-delay: .3s }
    .brain-node.n5 { animation-delay: .9s }
    .brain-node.n6 { animation-delay: 1.4s }
    @keyframes brainPulse   { 0%,100% { opacity:.35; transform:scale(.8);  } 50% { opacity:1;   transform:scale(1.2);  } }
    @keyframes brainBreathe { 0%,100% { opacity:.45; transform:scale(.9); } 50% { opacity:.85; transform:scale(1.08); } }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 9px;
      margin-bottom: 6px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }
    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 18px 14px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      text-align: center;
      letter-spacing: 10px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      caret-color: var(--accent);
    }
    .key-input::placeholder {
      color: rgba(147,147,158,0.5);
      letter-spacing: 6px;
      font-size: 20px;
    }
    .key-input:focus {
      border-color: var(--accent);
      background: var(--adim);
      box-shadow: 0 0 0 3px rgba(171,139,245,0.16);
    }
    .err {
      font-size: 12px;
      color: #f87171;
      min-height: 18px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: rgba(171,139,245,0.16);
      border: 1px solid rgba(171,139,245,0.45);
      color: #f3ecff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      border-radius: 14px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
    }
    .btn:hover  { opacity: 0.9; box-shadow: 0 0 18px rgba(171,139,245,0.3); }
    .btn:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
    .shake { animation: shake 0.35s ease; }
    .voice-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
      text-align: left;
    }
    .voice-note code {
      background: rgba(255,255,255,0.07);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
    }
    #reconnecting {
      display: none;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
    @media (prefers-reduced-motion: reduce) {
      .brain-node, .brain-halo { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brain" aria-hidden="true">
      <svg viewBox="0 0 100 92">
        <defs>
          <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   style="stop-color:var(--brain-c)" stop-opacity="0.95"/>
            <stop offset="45%"  style="stop-color:var(--brain-b)" stop-opacity="0.55"/>
            <stop offset="100%" style="stop-color:var(--brain-a)" stop-opacity="0"/>
          </radialGradient>
          <filter id="brainSoft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4"/>
          </filter>
          <filter id="brainHalo" x="-120%" y="-120%" width="340%" height="340%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
        </defs>
        <circle class="brain-halo" cx="50" cy="46" r="34" fill="url(#brainGlow)" filter="url(#brainHalo)"/>
        <g class="brain-outline">
          <path id="lobe" d="M50,8 C41,3 29,4 21,10 C13,16 8,25 10,35 C5,40 5,50 10,57 C9,65 14,73 23,77 C31,81 42,80 48,74 C51,71 51,66 49,62 C44,63 37,61 33,55 C29,50 30,43 35,39 C30,36 29,29 33,24 C30,21 31,15 37,12 C41,9 46,9 50,8 Z"/>
          <use href="#lobe" transform="translate(100,0) scale(-1,1)"/>
          <path class="brain-stem" d="M45,73 C45,80 47,86 50,88 C53,86 55,80 55,73 C53,75 47,75 45,73 Z"/>
        </g>
        <path class="brain-groove" d="M50,9 C48,20 51,31 50,42 C49,53 51,64 50,71"/>
        <g class="brain-nodes" filter="url(#brainSoft)">
          <circle class="brain-node n1" cx="26" cy="23" r="6"/>
          <circle class="brain-node n2" cx="17" cy="43" r="5.5"/>
          <circle class="brain-node n3" cx="27" cy="62" r="6"/>
          <circle class="brain-node n4" cx="74" cy="23" r="6"/>
          <circle class="brain-node n5" cx="83" cy="43" r="5.5"/>
          <circle class="brain-node n6" cx="73" cy="62" r="6"/>
        </g>
      </svg>
    </div>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="sub">Remote Access</div>
    <p id="reconnecting">Reconnecting…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the JARVIS desktop app to get a QR code or session key.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">CONNECT</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice commands:</strong> open
      <code>chrome://flags</code> on your phone, search
      <code>Insecure origins treated as secure</code>, add your JARVIS URL, tap Relaunch.
    </p>
  </div>

  <script>
    // Whatever page redirected here (e.g. /desktop) is passed through so
    // login lands back where it was actually headed, not always on "/".
    // Validated the same way the server validates it — a local path only —
    // so a crafted ?next= can't turn this into an open redirect.
    const _rawNext = new URLSearchParams(location.search).get('next') || '/';
    const _next = /^\/[A-Za-z0-9/_-]*$/.test(_rawNext) ? _rawNext : '/';

    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace(_next);
          return;
        }
      } catch (_) {}
      // Device token rejected (server restarted) — clear it and show normal form
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        if (data.device_token) {
          localStorage.setItem('jarvis_device_token', data.device_token);
        }
        location.href = _next;
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
