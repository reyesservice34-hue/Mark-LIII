# JARVIS Command Center — standalone compose file so it can be added next to an
# existing stack without touching it:
#   docker compose -f docker-compose.command-center.yml up -d --build
#
# Configure through command_center/.env (copy command_center/.env.example).
# Put a reverse proxy (Caddy / Traefik / nginx) with TLS in front of port 8080
# and set JARVIS_CC_SECURE_COOKIES=true (or leave "auto" with X-Forwarded-Proto).
services:
  jarvis-command-center:
    build:
      context: .
      dockerfile: command_center/Dockerfile
      args:
        # install.sh und setup-keys.sh setzen das auf den ausgecheckten Commit.
        # Steht es leer, liest die Anwendung ihn beim Start selbst aus dem
        # Arbeitsverzeichnis — im Container gibt es das nicht, dann sagt
        # /api/health ehrlich "unbekannt".
        JARVIS_CC_BUILD: "${JARVIS_CC_BUILD:-}"
        # Chromium für die browser.*-Werkzeuge. Kostet mehrere hundert MB,
        # deshalb aus; einschalten mit JARVIS_CC_BROWSER=true in der .env.
        JARVIS_CC_BROWSER: "${JARVIS_CC_BROWSER:-false}"
    image: jarvis-command-center:latest
    container_name: jarvis-command-center
    restart: unless-stopped
    env_file:
      - command_center/.env
    environment:
      JARVIS_CC_DATA_DIR: /data
      JARVIS_CC_WORKSPACE_DIR: /data/workspace
    ports:
      - "${JARVIS_CC_BIND:-127.0.0.1}:${JARVIS_CC_PORT:-8080}:8080"
    # The container runs as a non-root user, but the docker socket is
    # root:docker 660 — without that group it cannot read it, and the Server
    # page honestly but uselessly says "offline". The host's docker group id
    # differs per machine, so setup-keys.sh detects it and writes it to .env.
    # The default is nogroup, which grants nothing.
    group_add:
      - "${JARVIS_CC_DOCKER_GID:-65534}"
    networks:
      - default
      # Reaches a neighbouring stack (n8n, a database) by container name.
      # Set JARVIS_CC_SHARED_NETWORK in command_center/.env to that stack's
      # network; unset it falls back to the always-present default bridge,
      # which changes nothing.
      - shared
    # Damit ein Dienst, der auf dem Host selbst lauscht (Ollama, LM Studio,
    # eine Datenbank), unter host.docker.internal erreichbar ist. Unter Linux
    # gibt es diesen Namen sonst nicht — man müsste die Bridge-IP raten.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jarvis-cc-data:/data
      # Optional: let the Server page see and (with JARVIS_CC_ALLOW_DOCKER_ACTIONS=true) restart containers.
      # Read-only mount still allows list/stats/logs; restarts need :rw. Remove the line to disable docker entirely.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Am eigenen Quelltext arbeiten (source.*). Das Verzeichnis ist dasselbe,
      # aus dem gebaut wird, also wirkt eine Änderung beim nächsten Bauen —
      # anders als im Abbild, wo sie verschwände. Ohne JARVIS_CC_SOURCE_DIR in
      # der .env sind die Werkzeuge aus und sagen das auch; der Mount allein
      # schaltet nichts frei. Zum Abschalten die Zeile entfernen.
      - ${JARVIS_CC_SOURCE_MOUNT:-.}:/repo
      # Mark-LIII lives outside the Command-Center repository. Expose it in
      # MIA's normal workspace as read-only so filesystem.read can inspect the
      # real files without granting the container write access to the project.
      - /root/Mark-LIII:/data/workspace/Mark-LIII:ro
      # Semantisches Gedaechtnis (2026-09-20): Sucht nach Bedeutung statt nach Woertern. Diese drei Dateien
      # liegen hier statt im Abbild, damit kein Neubau noetig war. Bei einem Neubau stecken sie ohnehin im
      # Abbild, dann duerfen die drei Zeilen weg. Originale: /root/aufbewahrt-2026-09-19/vor-migration/code-original
      - ./command_center/backend/ai/embeddings.py:/app/command_center/backend/ai/embeddings.py:ro
      - ./command_center/backend/ai/__init__.py:/app/command_center/backend/ai/__init__.py:ro
      - ./command_center/backend/ai/chain.py:/app/command_center/backend/ai/chain.py:ro
      - ./command_center/backend/ai/openai_compat.py:/app/command_center/backend/ai/openai_compat.py:ro
      - ./command_center/backend/orchestrator/runtime.py:/app/command_center/backend/orchestrator/runtime.py:ro
      - ./command_center/backend/app.py:/app/command_center/backend/app.py:ro
      - ./command_center/backend/db.py:/app/command_center/backend/db.py:ro
      - ./command_center/backend/services/auto_learning.py:/app/command_center/backend/services/auto_learning.py:ro
      - ./command_center/backend/services/selfext.py:/app/command_center/backend/services/selfext.py:ro
      - ./command_center/backend/services/source.py:/app/command_center/backend/services/source.py:ro
      - ./command_center/backend/services/core_evolution.py:/app/command_center/backend/services/core_evolution.py:ro
      - ./command_center/backend/services/self_healing.py:/app/command_center/backend/services/self_healing.py:ro
      - ./command_center/backend/orchestrator/agent_registry.py:/app/command_center/backend/orchestrator/agent_registry.py:ro
      - ./command_center/backend/orchestrator/builtin_tools.py:/app/command_center/backend/orchestrator/builtin_tools.py:ro
      - ./command_center/backend/app.py:/app/command_center/backend/app.py:ro
      - ./command_center/backend/db.py:/app/command_center/backend/db.py:ro
      - ./command_center/backend/services/learning.py:/app/command_center/backend/services/learning.py:ro
      - ./command_center/backend/services/files.py:/app/command_center/backend/services/files.py:ro
      # MIA Windows/PowerShell Bridge (2026-09-22)
      - ./command_center/backend/services/installer.py:/app/command_center/backend/services/installer.py:ro
      - ./command_center/backend/modules/desktop/__init__.py:/app/command_center/backend/modules/desktop/__init__.py:ro
      # MIA Live-Sitzungen + persistente Sprach/Text-Verlaeufe (2026-09-22)
      - ./command_center/backend/modules/live/__init__.py:/app/command_center/backend/modules/live/__init__.py:ro
      - ./command_center/backend/services/realtime.py:/app/command_center/backend/services/realtime.py:ro
      - ./command_center/backend/services/realtime_gemini.py:/app/command_center/backend/services/realtime_gemini.py:ro
      - ./command_center/backend/static:/app/command_center/backend/static:ro
      - ./command_center/backend/modules/chat/__init__.py:/app/command_center/backend/modules/chat/__init__.py:ro
      - ./command_center/backend/modules/auth/__init__.py:/app/command_center/backend/modules/auth/__init__.py:ro
      # Google-Kalender lesen UND schreiben (2026-09-20), Zeit in Berlin. Ebenfalls ohne Neubau eingehaengt.
      - ./command_center/backend/services/calendar_service.py:/app/command_center/backend/services/calendar_service.py:ro
      - ./command_center/backend/modules/calendar/__init__.py:/app/command_center/backend/modules/calendar/__init__.py:ro
      - ./command_center/backend/modules/heartbeat/__init__.py:/app/command_center/backend/modules/heartbeat/__init__.py:ro
      # Buchhalter-Agent (2026-09-20): Lexware-Client und -Werkzeuge, Belegleser, Anhaenge aus Mails, Postfach-Ueberwachung.
      - ./command_center/backend/services/lexware.py:/app/command_center/backend/services/lexware.py:ro
      - ./command_center/backend/services/beleg_reader.py:/app/command_center/backend/services/beleg_reader.py:ro
      - ./command_center/backend/services/email_service.py:/app/command_center/backend/services/email_service.py:ro
      - ./command_center/backend/orchestrator/lexware_tools.py:/app/command_center/backend/orchestrator/lexware_tools.py:ro
      - ./command_center/backend/modules/buchhaltung/__init__.py:/app/command_center/backend/modules/buchhaltung/__init__.py:ro
      # Spracherkennung mit Wortvorrat-Hinweis (2026-09-20)
      - ./command_center/backend/services/voice_service.py:/app/command_center/backend/services/voice_service.py:ro
      # Standort/Puenktlichkeit (2026-09-20)
      - ./command_center/backend/modules/standort/__init__.py:/app/command_center/backend/modules/standort/__init__.py:ro
      - ./command_center/backend/modules/meldungen/__init__.py:/app/command_center/backend/modules/meldungen/__init__.py:ro
      - ./command_center/backend/services/notifications.py:/app/command_center/backend/services/notifications.py:ro
      - ./command_center/backend/services/phone.py:/app/command_center/backend/services/phone.py:ro
      - ./command_center/backend/modules/__init__.py:/app/command_center/backend/modules/__init__.py:ro
      # Der lokale Kalender-Spiegel gehoert aufs dauerhafte Volume: sonst ist er nach jedem Neustart leer und alle
      # Kategorien werden neu per Sprachmodell bestimmt (kostet Geld und dauert).
      - /var/lib/docker/volumes/jarvis_jarvis-cc-data/_data/calendar:/app/memory/calendar
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mia-core-watchdog:
    image: jarvis-command-center:latest
    container_name: mia-core-watchdog
    restart: unless-stopped
    user: root
    command: ["python", "/watchdog.py"]
    # Das Image bringt einen Healthcheck gegen 127.0.0.1:8080 mit. Der Watchdog hat keinen Webserver, der Check
    # schlug also immer fehl. Geprüft wird hier der Weg, den der Watchdog selbst braucht: das Backend im Netz.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://jarvis-command-center:8080/api/health',timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    group_add:
      - "${JARVIS_CC_DOCKER_GID:-65534}"
    networks:
      - default
    volumes:
      - jarvis-cc-data:/data
      - ${JARVIS_CC_SOURCE_MOUNT:-.}:/repo
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./command_center/core_watchdog.py:/watchdog.py:ro
    depends_on:
      - jarvis-command-center
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ── Ollama im selben Netz ───────────────────────────────────────────────
  # Aus, bis man es ausdrücklich will:
  #   docker compose --env-file command_center/.env \
  #     -f docker-compose.command-center.yml --profile ollama up -d
  #
  # Warum als Container und nicht auf dem Host: Ein Ollama, das auf dem Host
  # läuft, lauscht standardmäßig auf 127.0.0.1 und ist damit aus JEDEM
  # Container unerreichbar — auch über host.docker.internal. Man muss dann
  # systemd überschreiben, die Firewall öffnen und die Bridge-Adresse raten.
  # Hier stehen beide im selben Netz und reden über den Namen: kein Umweg,
  # keine Firewall, nichts zu raten.
  #
  # Dazu in command_center/.env:
  #   JARVIS_AI_PROVIDER=local
  #   LOCAL_LLM_URL=http://ollama:11434
  #   LOCAL_LLM_MODEL=qwen2.5:7b
  #
  # Das Modell einmal holen (sonst antwortet Ollama, kennt aber nichts):
  #   docker compose ... exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    # Ausdrücklich dasselbe Netz wie der Command Center. Beide lägen ohnehin
    # im Standardnetz — aber „ohnehin" ist keine Zusicherung, und wenn es
    # bricht, sucht man zuletzt hier.
    networks:
      - default
    # Kein Port nach außen: Nur der Command Center soll herankommen, und der
    # steht im selben Netz. Ein offener Port 11434 wäre ein Modellserver ohne
    # jede Anmeldung im Internet.
    expose: ["11434"]
    volumes:
      # Die Modelle überleben einen Neubau — sonst lädt man mehrere Gigabyte
      # bei jedem docker compose up erneut herunter.
      - jarvis-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Joined in addition to this stack's own network, so a container name like
  # http://n8n:5678 resolves. It must already exist — hence "external" — and
  # nothing is created or changed in the other stack by joining it.
  # Find the name with:
  #   docker inspect n8n --format '{{range $$k,$$v := .NetworkSettings.Networks}}{{$$k}} {{end}}'
  shared:
    external: true
    name: ${JARVIS_CC_SHARED_NETWORK:-bridge}

volumes:
  jarvis-cc-data:
  jarvis-ollama-models:
