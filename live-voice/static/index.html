<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis — Live-Gespräch</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; background: radial-gradient(circle at 50% 30%, #142033, #05070c 70%);
    color: #e8edf5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 16px; box-sizing: border-box;
  }
  h1 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px; color: #7fb0ff; margin: 0; }
  #orb {
    width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a9eff, #0c3a72 70%);
    box-shadow: 0 0 40px 8px rgba(74,158,255,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #orb.listening { box-shadow: 0 0 60px 16px rgba(74,255,158,0.35); }
  #orb.speaking { box-shadow: 0 0 60px 16px rgba(255,190,74,0.35); }
  #orb.thinking { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }
  #status { font-size: 15px; color: #9fb2cc; min-height: 20px; }
  #transcript { max-width: 560px; font-size: 14px; color: #6d7c94; min-height: 40px; white-space: pre-wrap; }
  #reply { max-width: 560px; font-size: 17px; color: #e8edf5; min-height: 50px; }
  button {
    background: #1a2740; color: #e8edf5; border: 1px solid #2c4270; border-radius: 999px;
    padding: 12px 28px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #24365c; }
  #err { color: #ff9d7f; font-size: 13px; max-width: 560px; }
  html.embedded, html.embedded body { background: transparent; min-height: 0; height: 100%; }
  html.embedded body { justify-content: center; gap: 10px; padding: 8px; }
  html.embedded h1 { display: none; }
  html.embedded #orb { display: none; }
  html.embedded #heard { font-size: 12px; }
  html.embedded #reply { font-size: 15px; min-height: 40px; }
  html.embedded #transcript { min-height: 20px; }
</style>
</head>
<body>
  <h1>Jarvis · Live</h1>
  <div id="orb"></div>
  <div id="status">Auf „Gespräch beginnen“ tippen und Mikrofon erlauben.</div>
  <div id="transcript"></div>
  <div id="heard" style="font-size:12px;color:#7fa7d6;min-height:16px"></div>
  <div id="reply"></div>
  <div id="timing" style="font-size:12px;color:#5f6f85;min-height:16px"></div>
  <div id="learned" style="font-size:12px;color:#5fbf8f;min-height:16px"></div>
  <div id="err"></div>
  <label style="font-size:12px;color:#7f8fa6;cursor:pointer"><input type="checkbox" id="cleanToggle"> Sprache vorher glätten (langsamer, +1 s)</label>
  <button id="toggle">Gespräch beginnen</button>

<script>
if (window.self !== window.top) document.documentElement.classList.add('embedded');
const orb = document.getElementById('orb');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const replyEl = document.getElementById('reply');
const errEl = document.getElementById('err');
const timingEl = document.getElementById('timing');
const learnedEl = document.getElementById('learned');
const toggleBtn = document.getElementById('toggle');
const heardEl = document.getElementById('heard');
const cleanToggle = document.getElementById('cleanToggle');
try { cleanToggle.checked = localStorage.getItem('jarvis_clean') === '1'; } catch (e) {}
cleanToggle.addEventListener('change', () => { try { localStorage.setItem('jarvis_clean', cleanToggle.checked ? '1' : '0'); } catch (e) {} });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const useSR = !!SR;                 // Chrome/Edge: Erkennung im Browser, kein Server-Whisper nötig
const QUIET_MS = 450;               // so lange darf der Text unverändert bleiben, dann gilt der Satz als fertig

let audioCtx, analyser, micStream, mediaRecorder, rec;
let chunks = [], history = JSON.parse(sessionStorage.getItem('jarvis_history') || '[]');
let running = false, recording = false, silenceMs = 0, turnStartedAt = 0, loudStreak = 0;
let currentAudio = null, audioQueue = [], abortCtl = null;
let SPEECH_THRESHOLD = 0.02;
const SILENCE_TO_END_MS = 550, MIN_TURN_MS = 400, MAX_TURN_MS = 15000;
// Spracherkennung im Browser
let fillers = [], lastFiller = -1, fillerTimer = null;
let inboxSince = 0, inboxTimer = null;
let memoryText = '', csrfToken = '', heardText = '';
let acceptResults = true, lastText = '', lastChange = 0, busy = false, quietTimer = null;

function setState(s) { orb.className = s; }
let outAnalyser = null;
function ensureOut() {
  if (!audioCtx || audioCtx.state === 'closed') return null;
  if (!outAnalyser) { outAnalyser = audioCtx.createAnalyser(); outAnalyser.fftSize = 512; outAnalyser.connect(audioCtx.destination); }
  return outAnalyser;
}
// Zustand und Lautstärke an das Dashboard melden (Gehirn pulsiert mit der Stimme)
setInterval(() => {
  if (window.parent === window) return;
  const st = orb.className || 'idle'; let level = 0;
  try {
    if (st === 'speaking' && outAnalyser) { const b = new Float32Array(outAnalyser.fftSize); outAnalyser.getFloatTimeDomainData(b); let s = 0; for (let i = 0; i < b.length; i++) s += b[i] * b[i]; level = Math.min(1, Math.sqrt(s / b.length) * 7); }
    else if (st === 'listening' && analyser) level = Math.min(1, rms() * 9);
    else if (st === 'thinking') level = .5;
  } catch (e) {}
  window.parent.postMessage({ jarvis: 'live', state: running ? st : 'idle', level }, location.origin);
}, 50);
function idleText() { return 'Ich höre zu, Master.'; }

async function start() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { errEl.textContent = 'Mikrofon-Zugriff wurde verweigert oder ist nicht verfügbar.'; return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; source.connect(analyser);

  statusEl.textContent = 'Kurz still sein, ich messe den Raum …';
  const samples = [];
  for (let i = 0; i < 12; i++) { await new Promise(r => setTimeout(r, 50)); samples.push(rms()); }
  SPEECH_THRESHOLD = Math.max(0.015, (samples.reduce((a, b) => a + b, 0) / samples.length) * 3.5);

  fetch('api/fillers').then(r => r.json()).then(d => { fillers = (d.items || []).map(i => URL.createObjectURL(b64ToBlob(i.audio_base64, i.audio_mime))); }).catch(() => {});
  running = true; busy = false; acceptResults = true;
  startInbox(); loadMemory(); setInterval(loadMemory, 300000);
  toggleBtn.textContent = 'Gespräch beenden';
  statusEl.textContent = idleText(); setState('listening');
  if (useSR) startRecognition();
  monitorLoop();
}

function stop() {
  running = false;
  try { if (rec) { rec.onend = null; rec.stop(); } } catch (e) {}
  clearInterval(quietTimer); clearInterval(inboxTimer);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  if (abortCtl) abortCtl.abort();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  audioQueue = [];
  toggleBtn.textContent = 'Gespräch beginnen'; statusEl.textContent = 'Gespräch beendet.'; setState('');
}

function rms() {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  return Math.sqrt(sum / buf.length);
}

/* ── Erkennung im Browser (schnell) ─────────────────────────────────── */
function startRecognition() {
  rec = new SR(); rec.lang = 'de-DE'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => {
    if (!acceptResults || busy) return;
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    t = t.trim();
    if (t && t !== lastText) { lastText = t; lastChange = performance.now(); transcriptEl.textContent = 'Sie: ' + t; }
    if (e.results[e.results.length - 1].isFinal && t) fireText();
  };
  rec.onerror = (e) => { if (e.error === 'not-allowed') errEl.textContent = 'Spracherkennung wurde vom Browser blockiert.'; };
  rec.onend = () => { if (running) { try { rec.start(); } catch (e) {} } };   // Chrome beendet sie von selbst, also neu starten
  try { rec.start(); } catch (e) {}
  clearInterval(quietTimer);
  quietTimer = setInterval(() => {
    // Text hat sich kurz nicht mehr geändert: Satz gilt als fertig, ohne auf Chromes langsames „final" zu warten.
    if (acceptResults && !busy && lastText && performance.now() - lastChange > QUIET_MS) fireText();
  }, 60);
}

function resetRecognition() {         // verwirft alles, was Chrome noch von Jarvis' eigener Stimme gepuffert hat
  lastText = '';
  try { if (rec) rec.stop(); } catch (e) {}   // onend startet neu
}

function fireText() {
  const text = lastText; lastText = '';
  if (!text) return;
  const tPause = performance.now() - lastChange;
  acceptResults = false; busy = true;
  setState('thinking'); statusEl.textContent = 'Einen Moment, Master …'; errEl.textContent = '';
  if (pendingApproval) { answerApproval(text).then(ok => { if (ok) { busy = false; acceptResults = true; setState('listening'); } else if (agentOK) runAgent(text, tPause); }); return; }
  reflex(text).then(ans => { if (ans) { sayReflex(text, ans); return; }
  polish(text).then(c => {
    heardEl.textContent = c.changed ? 'Verstanden: ' + c.text : '';
    if (c.unclear && c.question) {                       // wirklich unklar: erst nachfragen, nichts ausführen
      transcriptEl.textContent = 'Sie: ' + text; replyEl.textContent = c.question; heardText = text;
      audioQueue = []; sayChain = Promise.resolve(); sayQueued(c.question);
      history.push({ role: 'user', content: text }); history.push({ role: 'assistant', content: c.question });
      sessionStorage.setItem('jarvis_history', JSON.stringify(history.slice(-20)));
      sayChain.then(finishIfSilent); return;
    }
    const sendText = c.changed ? c.text + '\n(Erkannt wurde: „' + text + '“)' : text;
    if (agentOK) { runAgent(sendText, tPause, c.text); return; }
    const form = new FormData();
    form.append('text', c.text); form.append('history', JSON.stringify(history)); form.append('memory', memoryText);
    runTurn('api/turn_text', form, tPause);
  }); });
}

/* ── Lautstärke-Überwachung: Unterbrechen (und Aufnahme im Ausweichmodus) ─ */
function monitorLoop() {
  if (!running) return;
  const level = rms();
  const playing = !!(currentAudio || audioQueue.length);
  const need = playing ? SPEECH_THRESHOLD * 3 : SPEECH_THRESHOLD;   // eigene Stimme aus dem Lautsprecher zählt nicht
  loudStreak = level > need ? loudStreak + 1 : 0;
  const loud = playing ? loudStreak >= 4 : level > need;

  if (loud) {
    if (playing) {                                   // Ins-Wort-Fallen: Wiedergabe und laufende Antwort abbrechen
      if (currentAudio) currentAudio.pause();
      currentAudio = null; audioQueue = [];
      if (abortCtl) abortCtl.abort();
      cancelAgentRun();
      busy = false; acceptResults = true; lastText = '';
      setState('listening'); statusEl.textContent = idleText();
    }
    if (!useSR && !recording) beginTurn();
    silenceMs = 0;
  } else if (recording) {
    silenceMs += 50;
    const len = performance.now() - turnStartedAt;
    if ((silenceMs >= SILENCE_TO_END_MS && len > MIN_TURN_MS) || len > MAX_TURN_MS) endTurn();
  }
  setTimeout(monitorLoop, 50);
}

/* ── Ausweichmodus: Aufnahme an den Server (Whisper) ────────────────── */
function beginTurn() {
  recording = true; silenceMs = 0; turnStartedAt = performance.now(); chunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
  mediaRecorder = new MediaRecorder(micStream, { mimeType: mime });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.start(); setState('listening');
}
async function endTurn() {
  recording = false;
  if (!mediaRecorder) return;
  const mime = mediaRecorder.mimeType;
  const done = new Promise(res => { mediaRecorder.onstop = res; });
  mediaRecorder.stop(); await done;
  const blob = new Blob(chunks, { type: mime });
  if (blob.size < 800) { setState('listening'); return; }
  setState('thinking'); statusEl.textContent = 'Einen Moment, Master …'; errEl.textContent = '';
  const form = new FormData();
  form.append('audio', blob, 'clip.webm'); form.append('history', JSON.stringify(history));
  runTurn('api/turn', form, SILENCE_TO_END_MS);
}

/* ── Antwort empfangen und Satz für Satz abspielen ──────────────────── */
async function runTurn(url, form, pauseMs) {
  abortCtl = new AbortController(); audioQueue = [];
  const tSent = performance.now(); let tAudio = 0;
  // Wie ein Mensch: kommt die Antwort nicht gleich, kurz reagieren statt zu schweigen.
  clearTimeout(fillerTimer);
  fillerTimer = setTimeout(() => {
    if (tAudio || !fillers.length || !running) return;
    let i; do { i = Math.floor(Math.random() * fillers.length); } while (fillers.length > 1 && i === lastFiller);
    lastFiller = i; audioQueue.unshift(fillers[i]); playNext();
  }, 700);
  try {
    const r = await fetch(url, { method: 'POST', body: form, signal: abortCtl.signal });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', spoken = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const d = JSON.parse(line);
        if (d.error && !d.sentence) { errEl.textContent = d.error; statusEl.textContent = idleText(); setState('listening'); }
        if (d.transcript) { heardText = d.transcript; transcriptEl.textContent = 'Sie: ' + d.transcript; replyEl.textContent = ''; }
        if (d.sentence) { spoken += (spoken ? ' ' : '') + d.sentence; replyEl.textContent = spoken; }
        if (d.audio_base64) {
          if (!tAudio) {
            tAudio = performance.now(); clearTimeout(fillerTimer);
            timingEl.textContent = 'Pause ' + (pauseMs / 1000).toFixed(2) + ' s · Antwort-Ton nach ' + ((tAudio - tSent) / 1000).toFixed(1) + ' s'
              + (useSR ? ' (Chrome-Erkennung)' : ' (Server-Erkennung)');
          }
          audioQueue.push(URL.createObjectURL(b64ToBlob(d.audio_base64, d.audio_mime || 'audio/mpeg'))); playNext();
        }
        if (d.done) learn(heardText, spoken);
        if (d.done && d.history) { history = d.history; sessionStorage.setItem('jarvis_history', JSON.stringify(history)); }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') { errEl.textContent = 'Verbindung zum Server verloren.'; setState('listening'); statusEl.textContent = idleText(); }
  }
  finishIfSilent();
}


/* ── Voller Jarvis: dieselben Werkzeuge, Freigaben und Gedächtnis wie im Chat ─────────────
   Jede Äußerung geht als Nachricht in ein eigenes Chat-Gespräch („Live-Gespräch“) des Dashboards. Der Agent
   antwortet mit allen Werkzeugen; die Antwort wird Satz für Satz vorgelesen. Geht das nicht (nicht angemeldet,
   Server nicht erreichbar), springt die schnelle Sprechleitung ohne Werkzeuge ein. */
let agentConv = sessionStorage.getItem('jarvis_conv') || '', agentOK = true, agentRun = '', pendingApproval = null;
function csrf() { const m = document.cookie.match(/(?:^|;\s*)jcc_csrf=([^;]+)/); return m ? decodeURIComponent(m[1]) : ''; }
async function cc(path, body, method) {
  return fetch('/api/' + path, { method: method || 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() }, body: body === undefined ? undefined : JSON.stringify(body) });
}
async function ensureConv() {
  if (agentConv) return agentConv;
  const r = await cc('chat/conversations', { title: 'Live-Gespräch' });
  if (!r.ok) throw new Error('conv ' + r.status);
  agentConv = (await r.json()).conversation.id; sessionStorage.setItem('jarvis_conv', agentConv);
  return agentConv;
}
async function cancelAgentRun() { if (agentRun) { const id = agentRun; agentRun = ''; try { await cc('chat/runs/' + id + '/cancel', {}); } catch (e) {} } }

// Ein Satz nach dem anderen zu Ton machen, aber in der richtigen Reihenfolge abspielen.
let sayChain = Promise.resolve();
function sayQueued(text) {
  const f = new FormData(); f.append('text', text);
  const p = fetch('api/say', { method: 'POST', body: f }).then(r => r.json()).catch(() => ({}));
  sayChain = sayChain.then(() => p).then(a => {
    if (a && a.audio_base64) { audioQueue.push(URL.createObjectURL(b64ToBlob(a.audio_base64, a.audio_mime || 'audio/mpeg'))); playNext(); }
  });
  return sayChain;
}

const YES = /\b(ja|jawohl|jep|jo|klar|okay|ok|freigeben|freigabe|genehmigt|genehmige|mach|mach's|los|gerne|bitte|einverstanden|passt)\b/i;
const NO = /\b(nein|nö|nicht|stopp|stop|abbrechen|ablehnen|abgelehnt|lass|verwerfen)\b/i;
async function answerApproval(text) {
  const ap = pendingApproval; if (!ap) return false;
  const no = NO.test(text), yes = YES.test(text);
  if (!no && !yes) return false;                                 // etwas anderes gesagt: als normale Nachricht behandeln
  pendingApproval = null;
  try { await cc('approvals/' + ap.id + (no ? '/reject' : '/approve'), { note: 'per Sprache: ' + text.slice(0, 120) }); } catch (e) {}
  transcriptEl.textContent = 'Sie: ' + text; statusEl.textContent = no ? 'Abgelehnt.' : 'Freigegeben, ich mache weiter.';
  return true;
}


/* ── Reflexe: die häufigsten Fragen beantwortet Jarvis sofort, ohne Denkpause (Uhrzeit, Datum, Kalender, Server) ─ */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function uhr(d) { const m = d.getMinutes(); return d.getHours() + (m ? ' Uhr ' + m : ' Uhr'); }
async function reflex(t) {
  const q = t.toLowerCase().replace(/[?!.,]/g, ' ');
  try {
    if (/\b(wie sp(ä|ae)t|wie viel uhr|wieviel uhr|uhrzeit)\b/.test(q)) return 'Es ist ' + uhr(new Date()) + ', Master.';
    if (/\b(welcher tag|welches datum|den wievielten|welchen tag)\b/.test(q))
      return 'Heute ist ' + new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }) + ', Master.';
    const cal = q.match(/\b(termine?|kalender)\b/) && q.match(/\b(heute|morgen)\b/) && !/\b(anlegen|eintragen|verschieb|l(ö|oe)sch|absag|neu|mach|erstell|buch)/.test(q);
    if (cal) {
      const morgen = /\bmorgen\b/.test(q), a = new Date(); a.setHours(0, 0, 0, 0); if (morgen) a.setDate(a.getDate() + 1);
      const b = new Date(a); b.setDate(b.getDate() + 1);
      const r = await fetch('/api/calendar?start=' + ymd(a) + 'T00:00:00&end=' + ymd(b) + 'T00:00:00', { credentials: 'same-origin' });
      if (!r.ok) return null;
      const d = await r.json(); if (!d.available) return null;
      const ev = (d.events || []).slice().sort((x, y) => new Date(x.start) - new Date(y.start));
      const tag = morgen ? 'Morgen' : 'Heute';
      if (!ev.length) return tag + ' steht nichts im Kalender, Master.';
      let out = tag + (ev.length === 1 ? ' hast du einen Termin: ' : ' hast du ' + ev.length + ' Termine: ')
        + ev.slice(0, 5).map(e => 'um ' + uhr(new Date(e.start)) + ' ' + e.title).join(', ') + '.';
      if (ev.length > 5) out += ' Dazu noch ' + (ev.length - 5) + ' weitere.';
      for (let i = 0; i < ev.length - 1; i++)
        if (new Date(ev[i + 1].start) < new Date(ev[i].end)) { out += ' Achtung, Master: ' + ev[i].title + ' und ' + ev[i + 1].title + ' überschneiden sich.'; break; }
      return out;
    }
    if (/\b(serverstatus|status vom server|wie geht.s dem server|l(ä|ae)uft der server|server status)\b/.test(q)) {
      const r = await fetch('/api/status', { credentials: 'same-origin' }); if (!r.ok) return null;
      const s = (await r.json()).server; if (!s) return null;
      const p = v => Math.round(v <= 1 ? v * 100 : v);
      return (s.connected ? 'Dem Server geht es gut' : 'Achtung, Master: der Server meldet sich nicht') + '. Prozessor ' + p(s.cpu) + ' Prozent, Arbeitsspeicher ' + p(s.ram) + ' Prozent, Platte ' + p(s.disk) + ' Prozent.';
    }
  } catch (e) {}
  return null;
}
function sayReflex(text, answer) {
  transcriptEl.textContent = 'Sie: ' + text; replyEl.textContent = answer; heardText = text; heardEl.textContent = '';
  audioQueue = []; sayChain = Promise.resolve(); answer.split(/(?<=[.!?])\s+/).forEach(x => sayQueued(x));
  timingEl.textContent = 'Sofortantwort (ohne Denkpause)';
  history.push({ role: 'user', content: text }); history.push({ role: 'assistant', content: answer });
  sessionStorage.setItem('jarvis_history', JSON.stringify(history.slice(-20)));
  sayChain.then(finishIfSilent);
}

// Zwischen Erkennung und Jarvis: nuscheln, verschluckte Wörter und falsch erkannte Namen glätten (kostenlos, ~0,5 s).
async function polish(text) {
  if (!cleanToggle.checked || text.split(/\s+/).length < 3) return { text, changed: false, unclear: false, question: '' };
  try {
    const f = new FormData(); f.append('text', text); f.append('history', JSON.stringify(history.slice(-4))); f.append('memory', memoryText);
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('api/clean', { method: 'POST', body: f, signal: ctl.signal }); clearTimeout(t);
    return await r.json();
  } catch (e) { return { text, changed: false, unclear: false, question: '' }; }
}

async function runAgent(text, pauseMs, shown) {
  abortCtl = new AbortController(); audioQueue = []; sayChain = Promise.resolve();
  shown = shown || text; heardText = shown; transcriptEl.textContent = 'Sie: ' + shown; replyEl.textContent = '';
  const tSent = performance.now(); let tAudio = 0, spoken = '', pending = '', sentAny = false, firstOut = false;
  const speak = (t) => {
    t = t.trim(); if (!t) return; sentAny = true; spoken += (spoken ? ' ' : '') + t; replyEl.textContent = spoken;
    if (!tAudio) { tAudio = performance.now(); clearTimeout(fillerTimer);
      timingEl.textContent = 'Pause ' + (pauseMs / 1000).toFixed(2) + ' s · erste Antwort nach ' + ((tAudio - tSent) / 1000).toFixed(1) + ' s (voller Jarvis)'; }
    sayQueued(t);
  };
  const flushSentences = (final) => {
    if (!firstOut && pending.length >= 40) { const m = pending.match(/^(.{25,}?[,–—:;])\s/); if (m) { firstOut = true; speak(m[1]); pending = pending.slice(m[0].length); } }
    const parts = pending.split(/(?<=[.!?…])\s+/);
    for (let i = 0; i < parts.length - 1; i++) { firstOut = true; speak(parts[i]); }
    pending = parts[parts.length - 1];
    if (final && pending.trim()) { speak(pending); pending = ''; }
  };
  clearTimeout(fillerTimer);
  fillerTimer = setTimeout(() => { if (tAudio || !fillers.length || !running) return;
    let i; do { i = Math.floor(Math.random() * fillers.length); } while (fillers.length > 1 && i === lastFiller);
    lastFiller = i; audioQueue.unshift(fillers[i]); playNext(); }, 700);
  try {
    const conv = await ensureConv();
    const r = await fetch('/api/chat/conversations/' + conv + '/messages', { method: 'POST', credentials: 'same-origin', signal: abortCtl.signal,
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream', 'X-CSRF-Token': csrf() },
      body: JSON.stringify({ content: text, stream: true, channel: 'voice' }) });
    if (r.status === 401 || r.status === 403 || r.status === 404) { if (r.status === 404) { agentConv = ''; sessionStorage.removeItem('jarvis_conv'); } else agentOK = false; throw new Error('auth ' + r.status); }
    if (!r.ok) throw new Error('http ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '', ev = '', finished = false;
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).replace(/\r$/, ''); buf = buf.slice(nl + 1);
        if (line.startsWith('event:')) { ev = line.slice(6).trim(); continue; }
        if (!line.startsWith('data:')) continue;
        let j; try { j = JSON.parse(line.slice(5)); } catch (e) { continue; }
        const type = j.type || ev, d = (j.data !== undefined ? j.data : j);
        if (type === 'run.accepted') agentRun = d.run_id;
        else if (type === 'chat.delta') { pending += d.text || ''; flushSentences(false); }
        else if (type === 'chat.tool_call' || (type === 'run.activity' && d.kind === 'tool_call')) { statusEl.textContent = 'Jarvis arbeitet … ' + (d.tool || d.name || ''); }
        else if (type === 'approval.requested') {
          pendingApproval = { id: d.id };
          flushSentences(true);
          const what = (d.reason || d.action || 'eine Aktion').toString().slice(0, 200);
          speak('Master, das braucht deine Freigabe: ' + what + '. Sagst du ja oder nein?');
        }
        else if (type === 'message.updated' && d.status && d.status !== 'streaming' && !sentAny && d.content) { pending = String(d.content); }
        else if (type === 'run.finished') { finished = true; if (d.status === 'failed') errEl.textContent = 'Der Auftrag ist fehlgeschlagen.'; }
      }
    }
    flushSentences(true); agentRun = '';
    await sayChain;
    if (!sentAny) speak('Erledigt, Master.');
    learn(heardText, spoken);
    history.push({ role: 'user', content: shown }); history.push({ role: 'assistant', content: spoken });
    sessionStorage.setItem('jarvis_history', JSON.stringify(history.slice(-20)));
  } catch (e) {
    clearTimeout(fillerTimer); agentRun = '';
    if (e.name === 'AbortError') return;
    if (!sentAny) {                                              // nichts gesagt: schnelle Leitung als Ausweg
      errEl.textContent = agentOK ? 'Der volle Jarvis antwortet gerade nicht, ich nehme die schnelle Leitung.' : 'Nicht im Dashboard angemeldet: nur die schnelle Leitung ohne Werkzeuge.';
      const form = new FormData(); form.append('text', text); form.append('history', JSON.stringify(history)); form.append('memory', memoryText);
      return runTurn('api/turn_text', form, pauseMs);
    }
  }
  finishIfSilent();
}

function playNext() {
  if (currentAudio || audioQueue.length === 0) return;
  currentAudio = new Audio(audioQueue.shift());
  try { const oa = ensureOut(); if (oa && audioCtx.state === 'running') audioCtx.createMediaElementSource(currentAudio).connect(oa); } catch (e) {}
  setState('speaking'); statusEl.textContent = 'Jarvis spricht …';
  currentAudio.onended = () => { currentAudio = null; if (audioQueue.length) playNext(); else finishIfSilent(); };
  currentAudio.play().catch(() => {});
}

// Wenn Jarvis fertig ist (Antwort komplett empfangen und alles abgespielt): wieder zuhören.
function finishIfSilent() {
  if (currentAudio || audioQueue.length || !running) return;
  busy = false; acceptResults = true;
  if (useSR) resetRecognition();
  setState('listening'); statusEl.textContent = idleText();
}

/* ── Lernen: Dauerhaftes aus dem Gespräch ins Gedächtnis ────────────── */
async function learn(userText, reply) {
  try {
    if (!userText || userText.split(/\s+/).length < 3) return;
    const f = new FormData(); f.append('user', userText); f.append('assistant', reply); f.append('memory', memoryText);
    f.append('recent', history.slice(-6).map(m => (m.role === 'user' ? 'Nutzer: ' : 'Jarvis: ') + m.content).join('\n'));
    const d = await (await fetch('api/extract', { method: 'POST', body: f })).json();
    if (d.conflicts && d.conflicts.length) warn(d.conflicts[0]);   // Kollision: sofort ansprechen
    else if (d.advice && d.advice.length) warn(d.advice[0]);       // sonst ein hilfreicher Rat
    if (!d.facts || !d.facts.length) return;
    if (!csrfToken) csrfToken = (await (await fetch('/api/auth/me', { credentials: 'same-origin' })).json()).csrf_token || '';
    const day = new Date().toLocaleDateString('de-DE');
    const saved = [];
    for (const fact of d.facts) {
      const r = await fetch('/api/memory/facts', { method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
        body: JSON.stringify({ text: fact + ' (im Live-Gespräch gemerkt, ' + day + ')', pinned: false }) });
      if (r.status === 201) { saved.push(fact); memoryText += '\n- ' + fact; }
    }
    if (saved.length) { learnedEl.textContent = 'Gemerkt: ' + saved.join(' · '); setTimeout(() => { learnedEl.textContent = ''; }, 9000); }
  } catch (e) {}
}

/* ── Kollisions-Warnung: Jarvis spricht sie von selbst aus ──────────── */
async function warn(text) {
  try {
    errEl.style.color = '#ffb454'; errEl.textContent = text; setTimeout(() => { errEl.textContent = ''; errEl.style.color = ''; }, 15000);
    const f = new FormData(); f.append('text', text);
    const a = await (await fetch('api/say', { method: 'POST', body: f })).json();
    if (a.audio_base64) { audioQueue.push(URL.createObjectURL(b64ToBlob(a.audio_base64, a.audio_mime))); playNext(); }
    history.push({ role: 'assistant', content: text }); sessionStorage.setItem('jarvis_history', JSON.stringify(history));
  } catch (e) {}
}

/* ── Gedächtnis: dasselbe wie im Dashboard ────────────────────────────── */
async function loadMemory() {
  try {
    const r = await fetch('/api/memory?limit=200', { credentials: 'same-origin' });
    if (!r.ok) return;
    const d = await r.json();
    const facts = (d.facts || []).slice().sort((a, b) => (b.pinned | 0) - (a.pinned | 0));
    memoryText = facts.map(f => '- ' + f.text).join('\n').slice(0, 3800);
  } catch (e) {}
}

/* ── Jarvis meldet sich von selbst (Herzschlag des Dashboards) ───────── */
function startInbox() {
  clearInterval(inboxTimer); inboxSince = 0;
  const poll = async () => {
    if (!running) return;
    try {
      const r = await fetch('/api/heartbeat/inbox?since=' + inboxSince, { credentials: 'same-origin' });
      if (!r.ok) return;
      const d = await r.json();
      if (!inboxSince) { inboxSince = d.now; return; }          // erste Abfrage: nur Startpunkt merken, nichts nachsprechen
      if (!d.items.length) return;
      // Nur reden, wenn gerade nichts los ist; sonst beim nächsten Mal.
      if (busy || recording || currentAudio || audioQueue.length || lastText) return;
      const m = d.items[0]; inboxSince = m.ts;
      const f = new FormData(); f.append('text', m.text);
      const a = await (await fetch('api/say', { method: 'POST', body: f })).json();
      if (a.audio_base64) {
        replyEl.textContent = m.text; transcriptEl.textContent = '';
        history.push({ role: 'assistant', content: m.text }); sessionStorage.setItem('jarvis_history', JSON.stringify(history));
        audioQueue.push(URL.createObjectURL(b64ToBlob(a.audio_base64, a.audio_mime))); playNext();
      }
    } catch (e) {}
  };
  poll(); inboxTimer = setInterval(poll, 15000);
}

function b64ToBlob(b64, mime) {
  const bytes = atob(b64), arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

toggleBtn.addEventListener('click', () => { running ? stop() : start(); });
</script>
